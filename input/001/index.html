<!doctype html>
<html lang="et">
<head>
    <meta charset="utf-8">
    <title>Kalkulaator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <h1>Kalkulaator</h1>
    <input id="first" type="number" placeholder="Esimene arv">
    <select id="operator">
        <option value="add">+</option>
        <option value="subtract">-</option>
        <option value="multiply">*</option>
        <option value="divide">/</option>
    </select>
    <input id="second" type="number" placeholder="Teine arv">
    <button id="calculate">Arvuta</button>
    <p id="result"></p>
</main>
<script src="script.js"></script>
</body>
</html>
